[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arabic-voice-cloning-station"
version = "0.1.0"
description = "A fully local Arabic voice-cloning station."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchaudio",
    "transformers",
    "accelerate",
    "gradio",
    "fastapi",
    "uvicorn",
    "librosa",
    "soundfile",
    "numpy",
    "scipy",
    "pydantic",
    "pyyaml"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov"
]
